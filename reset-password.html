<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a New Password - Mystic Vibe</title>
  <meta name="description" content="Choose a new password for your Mystic Vibe account.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/monochrome.css">
  <link rel="stylesheet" href="css/premium.css">
  <link rel="stylesheet" href="css/theme-system.css">
</head>
<body data-page="reset-password">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="section">
      <div class="container">
        <div class="panel" style="max-width:34rem;margin:auto">
          <span class="eyebrow">Account security</span>
          <h1 class="serif">Choose a new password</h1>
          <p>Open this page from the reset link sent to your email, then choose a password of at least eight characters.</p>
          <form id="password-update-form" class="form-grid">
            <label class="full" for="new-password">New password</label>
            <input class="full" id="new-password" type="password" minlength="8" autocomplete="new-password" required>
            <button class="btn full" type="submit">Update password</button>
            <a class="full" href="forgot-password.html">Request another reset link</a>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="footer"></footer>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/wishlist-ui.js"></script>
  <script src="js/premium-home.js"></script>
  <script src="js/theme-system.js"></script>
</body>
</html>
