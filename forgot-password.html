<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password - Mystic Vibe</title>
  <meta name="description" content="Request a secure Mystic Vibe password reset link.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/monochrome.css">
  <link rel="stylesheet" href="css/premium.css">
  <link rel="stylesheet" href="css/theme-system.css">
</head>
<body data-page="forgot-password">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="section">
      <div class="container">
        <div class="panel" style="max-width:34rem;margin:auto">
          <span class="eyebrow">Account security</span>
          <h1 class="serif">Reset your password</h1>
          <p>Enter your account email and we’ll send a secure reset link if an account is registered.</p>
          <form id="password-reset-form" class="form-grid">
            <label class="full" for="reset-email">Email address</label>
            <input class="full" id="reset-email" type="email" autocomplete="email" required>
            <button class="btn full" type="submit">Send reset link</button>
            <a class="full" href="login.html">Back to sign in</a>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="footer"></footer>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/wishlist-ui.js"></script>
  <script src="js/premium-home.js"></script>
  <script src="js/theme-system.js"></script>
</body>
</html>
